name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speech-tests:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode sürümünü seç
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Paylaşılan mantığı teste kopyala
        run: cp GNLTranslete/Shared/*.swift Harness/Sources/Harness/
      - name: Konuşma testlerini çalıştır (10 senaryo)
        working-directory: Harness
        run: swift run -c release Harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: konusma-test-raporu
          path: Harness/test-report.md

  build:
    needs: speech-tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümünü seç
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: llama.cpp XCFramework indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Frameworks
          echo "Son sürümün dosyaları:"
          gh api "repos/ggml-org/llama.cpp/releases?per_page=1" --jq '.[0].tag_name, (.[0].assets[].name)'
          # iOS XCFramework içeren en yeni sürümü bul
          URL=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=30" \
            --jq '[.[] | .assets[] | select(.name | test("xcframework"; "i")) | .browser_download_url][0]')
          echo "Seçilen: $URL"
          test -n "$URL" && test "$URL" != "null"
          curl -sSL "$URL" -o llama.zip
          unzip -q llama.zip -d llama_tmp
          mv "$(find llama_tmp -name 'llama.xcframework' -type d | head -1)" Frameworks/
          echo "$URL" > Frameworks/LLAMA_VERSION.txt
          ls Frameworks/llama.xcframework

      - name: Model indirme adreslerini kontrol et
        continue-on-error: true
        run: |
          for u in $(grep -ho 'https://huggingface.co[^"]*gguf' GNLTranslete/LLM/ModelStore.swift); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I -L "$u"); echo "$code $u"
          done
          for r in Qwen/Qwen3-1.7B-GGUF Qwen/Qwen3-4B-GGUF unsloth/Qwen3-1.7B-GGUF unsloth/Qwen3-4B-GGUF; do
            echo "== $r"; curl -s "https://huggingface.co/api/models/$r" | grep -o '"rfilename":"[^"]*Q4_K_M[^"]*"' | head -3
            curl -s "https://huggingface.co/api/models/$r" | grep -o '"license":"[^"]*"' | head -1
          done
          echo "Whisper modelleri:"
          curl -s "https://huggingface.co/api/models/argmaxinc/whisperkit-coreml" | grep -oE 'openai_whisper-(large-v3|small)[^/"]*' | sort -u

      - name: Xcode projesini oluştur
        run: xcodegen generate

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild -project GNLTranslete.xcodeproj -scheme GNLTranslete \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=0.1.${{ github.run_number }} build | tee build.log | xcbeautify || (tail -200 build.log; exit 1)

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GNLTranslete.app Payload/
          zip -qr "GNL-Canli-Ceviri-${{ github.run_number }}.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GNL-Translete-ipa
          path: "*.ipa"

      - name: Sürüm yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" GNL-Canli-Ceviri-*.ipa --title "GNL-Translete $TAG" --notes "GNL-Canlı Çeviri — otomatik derleme. AltStore ile yükleyin." --latest

      - name: Eski sürümleri temizle (karışmasın)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Son 3 sürüm kalsın: yeni sürüm sorun çıkarırsa bir öncekine dönülebilsin
          for t in $(gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '.[3:][].tag_name'); do
            gh release delete "$t" --cleanup-tag -y -R "${{ github.repository }}"
          done
