name: GNLTranslete
options:
  bundleIdPrefix: com.gnl
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
targets:
  GNLTranslete:
    type: application
    platform: iOS
    sources:
      - GNLTranslete
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
      - package: WhisperKit
    info:
      path: GNLTranslete/Info.plist
      properties:
        CFBundleDisplayName: GNL-Canlı Çeviri
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Karşınızdaki kişiyi dinleyip çevirmek ve telaffuzunuzu değerlendirmek için mikrofon gerekir."
        NSSpeechRecognitionUsageDescription: "Konuşmalar cihaz üzerinde yazıya dökülür. Ses sunucuya gönderilmez."
        NSCameraUsageDescription: "İngilizce yazıları canlı görüntüde çevirmek için kamera gerekir. Görüntüler kaydedilmez ve gönderilmez."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnl.translete
        PRODUCT_NAME: GNLTranslete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
